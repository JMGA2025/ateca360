<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Virtual Aula ATECA 360</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #info-ui {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      color: #f8fafc;
      font-size: 13px;
    }
    #info-ui strong { color: #38bdf8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="info-ui">
    <strong>Aula ATECA</strong><br>
    Haz clic en los puntos para interactuar. Pulsa "Enter VR" en Quest 3.
  </div>

  <script>
    // --- 1. BOTÓN WEBXR EMBEBIDO ---
    const VRButton = {
      createButton: function(renderer) {
        const button = document.createElement('button');
        button.style.position = 'absolute';
        button.style.bottom = '20px';
        button.style.left = 'calc(50% - 75px)';
        button.style.width = '150px';
        button.style.padding = '12px 6px';
        button.style.border = '1px solid #38bdf8';
        button.style.borderRadius = '8px';
        button.style.background = 'rgba(15, 23, 42, 0.9)';
        button.style.color = '#38bdf8';
        button.style.fontWeight = 'bold';
        button.style.cursor = 'pointer';
        button.style.zIndex = '999';

        if ('xr' in navigator) {
          navigator.xr.isSessionSupported('immersive-vr').then(supported => {
            if (supported) {
              button.textContent = 'ENTER VR';
              let session = null;
              button.onclick = async () => {
                if (!session) {
                  session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
                  renderer.xr.setSession(session);
                  button.textContent = 'SALIR VR';
                  session.addEventListener('end', () => { session = null; button.textContent = 'ENTER VR'; });
                } else {
                  session.end();
                }
              };
            } else {
              button.textContent = 'VR NO SOPORTADO';
              button.style.opacity = '0.5';
            }
          });
        } else {
          button.textContent = 'WEBXR NO DISPONIBLE';
          button.style.opacity = '0.5';
        }
        return button;
      }
    };

    // --- 2. CONFIGURACIÓN DE LA ESCENA ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.rotateSpeed = -0.3;

    // --- 3. CILINDRO PANORÁMICO Y CARGA DE FONDO ---
    const radius = 40;
    const height = 22;
    const cylinderGeo = new THREE.CylinderGeometry(radius, radius, height, 60, 1, true);
    cylinderGeo.scale(-1, 1, 1);

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const maxW = 4096;
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }

      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);

      const texture = new THREE.CanvasTexture(cv);
      texture.wrapS = THREE.RepeatWrapping;
      const mat = new THREE.MeshBasicMaterial({ map: texture });
      scene.add(new THREE.Mesh(cylinderGeo, mat));
    };
    img.src = 'ateca360.jpg?v=' + Date.now();

    // --- 4. SISTEMA DE GENERACIÓN DE PANELES (TEXTO O FOTO) ---
    const interactiveObjects = [];
    const pinsGroup = new THREE.Group();
    scene.add(pinsGroup);

    // Tarjeta con texto
    function crearTarjetaTexto(titulo, descripcion) {
      const cv = document.createElement('canvas');
      cv.width = 512;
      cv.height = 256;
      const ctx = cv.getContext('2d');

      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.roundRect(10, 10, 492, 236, 18);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText(titulo, 30, 60);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '21px sans-serif';
      descripcion.split('\n').forEach((linea, i) => {
        ctx.fillText(linea, 30, 115 + (i * 32));
      });

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'italic 16px sans-serif';
      ctx.fillText('[ Haz clic para cerrar ]', 30, 220);

      const texture = new THREE.CanvasTexture(cv);
      const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(6.5, 3.25), mat);
      mesh.visible = false;
      return mesh;
    }

    // Tarjeta con imagen (formato panorámico 16:9)
    function crearTarjetaImagen(url) {
      const loader = new THREE.TextureLoader();
      const texture = loader.load(url);
      const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      // Proporción aproximada de pantalla flotante (8 de ancho x 4.5 de alto)
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(8, 4.5), mat);
      mesh.visible = false;
      return mesh;
    }

    // --- 5. CONFIGURACIÓN DE LOS PUNTOS ---
    const puntosCalibrados = [
      {
        pos: { x: -27.06, y: -1.6, z: -7.04 },
        tipo: 'texto',
        titulo: "Armario Ateca",
        texto: "Almacenamiento de material,\nvisores y herramientas tecnológicas."
      },
      {
        pos: { x: 1.27, y: -3.51, z: -27.93 },
        tipo: 'imagen',
        archivo: 'corazon.jpg' // Imagen del modelo anatómico en RA
      },
      {
        pos: { x: 20.67, y: -0.51, z: -18.87 },
        tipo: 'texto',
        titulo: "Impresora 3D",
        texto: "Estación de prototipado y\nfabricación aditiva para proyectos."
      }
    ];

    puntosCalibrados.forEach((item) => {
      // Icono flotante
      const pinGeo = new THREE.SphereGeometry(0.7, 16, 16);
      const pinMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const pin = new THREE.Mesh(pinGeo, pinMat);
      pin.position.set(item.pos.x, item.pos.y, item.pos.z);

      let panel;
      if (item.tipo === 'imagen') {
        panel = crearTarjetaImagen(item.archivo);
        panel.position.set(item.pos.x, item.pos.y + 3.2, item.pos.z);
      } else {
        panel = crearTarjetaTexto(item.titulo, item.texto);
        panel.position.set(item.pos.x, item.pos.y + 2.6, item.pos.z);
      }

      pin.userData = { panel };
      panel.userData = { isPanel: true };

      scene.add(panel);
      pinsGroup.add(pin);
      interactiveObjects.push(pin, panel);
    });

    // --- 6. INTERACCIÓN (RATÓN + QUEST 3) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function interactuar(obj) {
      if (!obj) return;
      if (obj.userData.panel) {
        obj.userData.panel.visible = !obj.userData.panel.visible;
      } else if (obj.userData.isPanel) {
        obj.visible = false;
      }
    }

    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(interactiveObjects.filter(o => o.visible || o.parent === pinsGroup));
      if (hits.length > 0) interactuar(hits[0].object);
    });

    // Puntero láser para Meta Quest 3
    const controller = renderer.xr.getController(0);
    const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -40)]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0x38bdf8 });
    const laser = new THREE.Line(laserGeo, laserMat);
    controller.add(laser);
    scene.add(controller);

    const tempMatrix = new THREE.Matrix4();
    controller.addEventListener('selectstart', () => {
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const hits = raycaster.intersectObjects(interactiveObjects.filter(o => o.visible || o.parent === pinsGroup));
      if (hits.length > 0) {
        interactuar(hits[0].object);
        if (controller.gamepad && controller.gamepad.hapticActuators && controller.gamepad.hapticActuators[0]) {
          controller.gamepad.hapticActuators[0].pulse(0.6, 60);
        }
      }
    });

    // --- 7. ANIMACIÓN Y ORIENTACIÓN CONTINUA ---
    let time = 0;
    renderer.setAnimationLoop(() => {
      time += 0.05;

      // Mantener paneles e iconos orientados hacia el usuario
      interactiveObjects.forEach(obj => obj.lookAt(camera.position));

      // Animación de pulso
      pinsGroup.children.forEach((pin, i) => {
        const s = 1 + Math.sin(time + i * 1.5) * 0.15;
        pin.scale.set(s, s, s);
      });

      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

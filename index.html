<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Aula ATECA 360</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
    #ui {
      position: absolute; top: 10px; left: 10px; z-index: 100;
      background: rgba(0,0,0,0.85); color: #fff; padding: 12px 16px;
      border-radius: 8px; max-width: 380px; font-size: 13px; line-height: 1.5;
    }
    #log { margin-top: 8px; color: #ffeb3b; font-family: monospace; font-size: 11px; white-space: pre-wrap; }
    input[type="file"] { margin-top: 8px; font-size: 12px; color: #fff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>
</head>
<body>
  <div id="ui">
    <strong>Visor ATECA 360</strong><br>
    Arrastra con el ratón para girar.<br>
    <div id="log">Iniciando visor...</div>
    <div style="margin-top: 10px; border-top: 1px solid #444; padding-top: 8px;">
      Si la pantalla sigue oscura, selecciona la foto directamente desde aquí:<br>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.innerText = msg;
      console.log(msg);
    }

    // 1. Escena, cámara y renderizador
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.rotateSpeed = -0.3;

    // 2. Geometría envolvente (Cilindro / Esfera)
    // Usamos una esfera grande invertida
    const geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1);

    let sphereMesh = null;

    function aplicarTextura(texture) {
      texture.wrapS = THREE.RepeatWrapping;
      texture.repeat.x = 1;
      
      if (sphereMesh) {
        sphereMesh.material.map = texture;
        sphereMesh.material.needsUpdate = true;
      } else {
        const material = new THREE.MeshBasicMaterial({ map: texture });
        sphereMesh = new THREE.Mesh(geometry, material);
        scene.add(sphereMesh);
      }
      log("¡Foto cargada con éxito! Ya puedes arrastrar para mirar.");
    }

    // 3. Intento de carga automática desde el servidor
    log("Buscando ateca360.jpg en el servidor...");
    const loader = new THREE.TextureLoader();
    loader.load(
      'ateca360.jpg',
      function (texture) {
        aplicarTextura(texture);
      },
      undefined,
      function (err) {
        log("No se pudo cargar 'ateca360.jpg' desde la web (error 404 o nombre distinto).\n\nUsa el botón de abajo para seleccionarla desde tu equipo.");
      }
    );

    // 4. Selector manual directo (sin depender de GitHub)
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      log("Cargando archivo local: " + file.name + "...");
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;
          aplicarTextura(texture);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Visual ATECA</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050508; font-family: sans-serif; user-select: none; }
    #editor-ui {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 12px 16px; color: #f8fafc; font-size: 13px; max-width: 320px;
    }
    #editor-ui h2 { margin: 0 0 6px 0; font-size: 15px; color: #38bdf8; }
    .btn {
      background: #0284c7; color: #fff; border: none; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 8px;
    }
    .btn:hover { background: #0369a1; }
    .btn-green { background: #16a34a; }
    .btn-green:hover { background: #15803d; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="editor-ui">
    <h2>Editor Aula ATECA</h2>
    <div>📍 <strong>Doble clic</strong> sobre cualquier objeto de la foto para colocar un punto.</div>
    <div id="conteo" style="margin-top:6px; color:#94a3b8;">Puntos creados: 0</div>
    <button class="btn btn-green" onclick="exportarPuntos()">Copiar código de puntos</button>
  </div>

  <script>
    // 1. Escena
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.rotateSpeed = -0.3;

    // 2. Cilindro con tu foto
    const radius = 40;
    const height = 22;
    const cylinderGeo = new THREE.CylinderGeometry(radius, radius, height, 60, 1, true);
    cylinderGeo.scale(-1, 1, 1);

    let cylinderMesh;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const maxW = 4096;
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }

      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);

      const texture = new THREE.CanvasTexture(cv);
      texture.wrapS = THREE.RepeatWrapping;
      const mat = new THREE.MeshBasicMaterial({ map: texture });
      cylinderMesh = new THREE.Mesh(cylinderGeo, mat);
      scene.add(cylinderMesh);
    };
    img.src = 'ateca360.jpg?v=' + Date.now();

    // 3. Hotspots
    const listaPuntos = [];
    const interactiveObjects = [];

    function crearTarjetaTexto(titulo, descripcion) {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 256;
      const ctx = cv.getContext('2d');

      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.roundRect(10, 10, 492, 236, 20);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText(titulo, 30, 60);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '20px sans-serif';
      descripcion.split('\n').forEach((l, i) => ctx.fillText(l, 30, 110 + (i * 32)));

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'italic 16px sans-serif';
      ctx.fillText('[ Clic para cerrar ]', 30, 220);

      const mat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, side: THREE.DoubleSide });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), mat);
      mesh.visible = true;
      return mesh;
    }

    function agregarHotspot(pos, titulo, texto) {
      // Icono
      const pin = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      pin.position.copy(pos);

      // Panel
      const panel = crearTarjetaTexto(titulo, texto);
      panel.position.set(pos.x, pos.y + 2.5, pos.z);

      pin.userData = { panel };
      panel.userData = { isPanel: true };

      scene.add(pin);
      scene.add(panel);
      interactiveObjects.push(pin, panel);

      listaPuntos.push({ pos: { x: +pos.x.toFixed(2), y: +pos.y.toFixed(2), z: +pos.z.toFixed(2) }, titulo, texto });
      document.getElementById('conteo').textContent = `Puntos creados: ${listaPuntos.length}`;
    }

    // 4. Doble clic para colocar
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('dblclick', (e) => {
      if (!cylinderMesh) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObject(cylinderMesh);
      if (hits.length > 0) {
        const puntoImpacto = hits[0].point.clone().multiplyScalar(0.7); // Lo acerca hacia nosotros para que no choque con la pared
        
        const titulo = prompt("Título del punto:", "Puesto de trabajo");
        if (!titulo) return;
        const texto = prompt("Descripción corta:", "Información del equipo...");
        if (!texto) return;

        agregarHotspot(puntoImpacto, titulo, texto);
      }
    });

    // Clic simple para abrir/cerrar
    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(interactiveObjects.filter(o => o.visible));
      if (hits.length > 0) {
        const obj = hits[0].object;
        if (obj.userData.panel) {
          obj.userData.panel.visible = !obj.userData.panel.visible;
        } else if (obj.userData.isPanel) {
          obj.visible = false;
        }
      }
    });

    // 5. Exportar los datos
    window.exportarPuntos = function() {
      if (listaPuntos.length === 0) {
        alert("Aún no has creado ningún punto con doble clic.");
        return;
      }
      const dataStr = JSON.stringify(listaPuntos, null, 2);
      navigator.clipboard.writeText(dataStr).then(() => {
        alert("¡Copiado al portapapeles!\n\nPega ese texto aquí en el chat para que te lo deje fijo en el visor definitivo.");
      });
    };

    // Bucle
    renderer.setAnimationLoop(() => {
      interactiveObjects.forEach(o => o.lookAt(camera.position));
      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

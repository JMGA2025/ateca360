<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Aula ATECA 360</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 16px;
      color: #f8fafc;
      max-width: 360px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: opacity 0.5s ease;
    }
    #ui-container h1 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #38bdf8;
      font-weight: 600;
    }
    #status {
      margin-top: 6px;
      font-family: monospace;
      font-size: 11px;
      color: #facc15;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    #fallback-picker {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }
    input[type="file"] {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 4px;
    }
  </style>
  <!-- Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="ui-container">
    <h1>Visor Aula ATECA</h1>
    <div>Arrastra con el ratón o usa el visor VR.</div>
    <div id="status">Cargando 'ateca360.jpg' automáticamente...</div>
    <div id="fallback-picker">
      <span style="color:#ef4444;">No se encontró 'ateca360.jpg' junto al index.html.</span><br>
      Puedes seleccionarla manualmente aquí:<br>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </div>

  <script>
    // --- 1. VR BUTTON EMBEBIDO ---
    const VRButton = {
      createButton: function(renderer) {
        const button = document.createElement('button');
        button.id = 'VRButton';
        button.style.position = 'absolute';
        button.style.bottom = '20px';
        button.style.left = 'calc(50% - 75px)';
        button.style.width = '150px';
        button.style.padding = '12px 6px';
        button.style.border = '1px solid #38bdf8';
        button.style.borderRadius = '8px';
        button.style.background = 'rgba(15, 23, 42, 0.9)';
        button.style.color = '#38bdf8';
        button.style.font = 'bold 13px sans-serif';
        button.style.cursor = 'pointer';
        button.style.zIndex = '999';
        button.style.transition = 'all 0.2s ease';

        function showEnterVR(device) {
          let currentSession = null;
          async function onSessionStarted(session) {
            session.addEventListener('end', onSessionEnded);
            await renderer.xr.setSession(session);
            button.textContent = 'SALIR VR';
            currentSession = session;
          }
          function onSessionEnded() {
            currentSession.removeEventListener('end', onSessionEnded);
            button.textContent = 'ENTER VR';
            currentSession = null;
          }
          button.textContent = 'ENTER VR';
          button.onclick = function() {
            if (currentSession === null) {
              const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
              navigator.xr.requestSession('immersive-vr', sessionInit).then(onSessionStarted);
            } else {
              currentSession.end();
            }
          };
        }

        function disableButton() {
          button.style.display = '';
          button.style.cursor = 'auto';
          button.style.opacity = '0.5';
          button.onclick = null;
        }

        if ('xr' in navigator) {
          button.id = 'VRButton';
          navigator.xr.isSessionSupported('immersive-vr').then(function(supported) {
            if (supported) {
              showEnterVR();
            } else {
              button.textContent = 'VR NO SOPORTADO';
              disableButton();
            }
          }).catch(function() {
            button.textContent = 'VR NO DISPONIBLE';
            disableButton();
          });
        } else {
          button.textContent = 'WEBXR NO DETECTADO';
          disableButton();
        }
        return button;
      }
    };

    // --- 2. CONFIGURACIÓN THREE.JS ---
    const statusEl = document.getElementById('status');
    const fallbackEl = document.getElementById('fallback-picker');
    const uiContainer = document.getElementById('ui-container');

    function setStatus(text, color = '#facc15') {
      statusEl.textContent = text;
      statusEl.style.color = color;
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.rotateSpeed = -0.3;

    // --- 3. GEOMETRÍA CILÍNDRICA PANORÁMICA ---
    // Usamos un cilindro panorámico envolvente invertido para evitar la compresión en los polos
    const cylinderRadius = 50;
    const cylinderHeight = 28;
    const cylinderGeo = new THREE.CylinderGeometry(cylinderRadius, cylinderRadius, cylinderHeight, 60, 1, true);
    cylinderGeo.scale(-1, 1, 1);

    let panoMesh = null;

    // Procesamiento seguro de imagen: redimensiona en canvas si supera los 4096px
    function procesarYProyectarImagen(imgSource) {
      setStatus('Adaptando resolución para WebGL y Quest...', '#38bdf8');
      
      const maxDim = 4096;
      let targetW = imgSource.width;
      let targetH = imgSource.height;

      if (targetW > maxDim) {
        const ratio = maxDim / targetW;
        targetW = maxDim;
        targetH = Math.round(targetH * ratio);
      }

      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(imgSource, 0, 0, targetW, targetH);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.repeat.x = 1;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      if (panoMesh) {
        panoMesh.material.map.dispose();
        panoMesh.material.map = texture;
        panoMesh.material.needsUpdate = true;
      } else {
        const material = new THREE.MeshBasicMaterial({ map: texture });
        panoMesh = new THREE.Mesh(cylinderGeo, material);
        scene.add(panoMesh);
      }

      setStatus(`¡Foto cargada correctamente! (${targetW}x${targetH})`, '#4ade80');
      fallbackEl.style.display = 'none';

      // Ocultar suavemente el recuadro tras 3 segundos para dejar la vista despejada
      setTimeout(() => {
        uiContainer.style.opacity = '0.35';
      }, 3000);
    }

    // --- 4. CARGA AUTOMÁTICA DIRECTA ---
    function cargarFotoDirecta(url) {
      setStatus(`Cargando directamente '${url}'...`);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        procesarYProyectarImagen(img);
      };
      img.onerror = () => {
        setStatus(`Error al cargar '${url}'. Revisa que el archivo esté en la raíz de GitHub Pages.`, '#ef4444');
        fallbackEl.style.display = 'block';
        uiContainer.style.opacity = '1';
      };
      img.src = url + '?v=' + Date.now(); // Cache-busting para obligar a refrescar
    }

    // Carga inmediata al arrancar
    cargarFotoDirecta('ateca360.jpg');

    // --- 5. SELECTOR DE RESPALDO (Por si la red falla) ---
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setStatus(`Procesando archivo local: ${file.name}...`);
      const reader = new FileReader();
      reader.onload = (event) => {
        const localImg = new Image();
        localImg.onload = () => procesarYProyectarImagen(localImg);
        localImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // --- 6. EVENTOS Y BUCLE DE RENDER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
